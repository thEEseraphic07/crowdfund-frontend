<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<link rel="stylesheet" href="../css/register.css">
</head>

<body>

<div class="particles">
  <span style="left:15%; animation-delay:1s;"></span>
  <span style="left:40%; animation-delay:3s;"></span>
  <span style="left:65%; animation-delay:2s;"></span>
  <span style="left:85%; animation-delay:4s;"></span>
</div>

<div id="intro">
  <h1 id="brand"></h1>
</div>

<div class="auth-container">

  <div class="left-panel">
    <h1>Welcome to <span class="span">CrowdFund</span></h1>
  </div>

  <div class="form-panel">
    <h2>Register</h2>

    <form action="" id="registerForm">
      <div class="input-group">
      <input type="text" id="name" placeholder="Full Name" required>
    </div>

    <div class="input-group">
      <input type="email" id="email" placeholder="Email" required>
    </div>

    <div class="input-group">
      <input type="password" id="password" placeholder="Password" required>
    </div>

    <div class="input-group">
      <input type="password" id="confirmPassword" placeholder="confirm password" required>
    </div>

    <button id="submitbtn" class="btn">Create Account</button>
    <p id="errorMsg" style="color: blue; font-size: 12px; font-family: sans-serif;"></p>
    <p id="message" style="color: red; font-size: 12px; font-family: sans-serif;"></p>
    </form>
    <a href="login.html">Already have an account? Login here</a>
  </div>

</div>

<script src="../javascript/config.js"></script>
<script src="../javascript/register.js"></script>

</body>
</html>
