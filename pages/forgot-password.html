<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password | CrowdFund</title>
  <link rel="stylesheet" href="../css/auth.css"/>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Forgot Password</h2>
    <p class="subtitle">
      Enter your email and we’ll send you a reset link
    </p>

    <form id="forgotForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@email.com" required/>
        <small class="error"></small>
      </div>

      <button onclick="forgotPassword()" class="btn primary">Send Reset Link</button>

      <div class="auth-links">
        <a href="login.html">Back to login</a>
      </div>
    </form>

    <p id="successMsg" class="success"></p>
  </div>
</div>

<script src="../javascript/config.js"></script>
<script src="../javascript/forgot-password.js"></script>
</body>
</html>
